name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run test
      - run: npm run build
      - run: npm run rebuild:native
      - run: npm run package:${{ runner.os == 'Linux' && 'linux' || runner.os == 'macOS' && 'mac' || 'win' }}
      - run: npm run checksums
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.AppImage
            release/*.deb
            release/*.dmg
            release/*.exe
            release/SHA256SUMS
          generate_release_notes: true
