name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install
        run: npm ci
      - name: Electron binary
        run: node node_modules/electron/install.js
      - name: Electron sandbox permissions (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc -p tsconfig.json --noEmit
      - name: Unit and integration tests
        if: runner.os != 'Windows'
        run: npm run test
      - name: Coordinator tests
        if: runner.os != 'Windows'
        run: npm run test:coordinator
      - name: Build
        run: npm run build
      - name: Native PTY rebuild (Electron)
        run: npm run rebuild:native
      - name: Smoke tests (Linux, Xvfb)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          npm run test:ipc-smoke
          npm run test:pty-smoke
          npm run test:layout
          npm run test:stt-smoke
          npm run test:ai-smoke
          npm run test:e2e
      - name: Package
        run: npm run package:${{ runner.os == 'Linux' && 'linux' || runner.os == 'macOS' && 'mac' || 'win' }}
      - name: Verify Linux package entry
        if: runner.os == 'Linux'
        run: npm run test:package-linux
      - name: Checksums
        run: npm run checksums
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.os }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.dmg
            release/*.exe
            release/SHA256SUMS
          if-no-files-found: error
